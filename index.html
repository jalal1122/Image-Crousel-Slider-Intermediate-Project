<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
  </head>
  <body>
    <div class="swiper">
        <!-- Additional required wrapper -->
        <div class="swiper-wrapper">
          <!-- Slides -->
          <img src="./images/1.jpg" alt="" class="swiper-slide" />
          <img src="./images/2.jpg" alt="" class="swiper-slide" />
          <img src="./images/3.jpg" alt="" class="swiper-slide" />
          <img src="./images/4.jpg" alt="" class="swiper-slide" />
          <img src="./images/5.jpg" alt="" class="swiper-slide" />
          <img src="./images/6.jpg" alt="" class="swiper-slide" />
        </div>
        <!-- If we need pagination -->
        <div class="swiper-pagination"></div>
      
        <!-- If we need navigation buttons -->
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
      </div>
      <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
      <script src="./script.js"></script>
  </body>
</html>
